[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-playground"
version = "0.1.0"
description = "Minimal bootstrap, verification, and devcontainer runtime helpers for cpp-playground"
requires-python = ">=3.12"

[project.scripts]
devcontainer-runtime = "cpp_playground.devcontainer_runtime:main"
finalize-bootstrap = "cpp_playground.finalize_bootstrap:main"
verify = "cpp_playground.verify:main"

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "ty==0.0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
