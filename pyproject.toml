[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-playground-tooling"
version = "0.1.0"
description = "Python control plane for the cpp-playground dev environment"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "ty==0.0.24",
]

[tool.setuptools]
packages = ["tooling"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["tooling"]
