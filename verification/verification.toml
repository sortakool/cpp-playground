[[suite]]
name = "build-optimization.pin-alignment"
description = "Bake defaults and Dockerfile fallback ARG defaults stay aligned for shared build pins."
commands = [
  "python3 - <<'PY'\nimport re\nfrom pathlib import Path\nbake_text = Path('docker-bake.hcl').read_text()\ndockerfile_text = Path('Dockerfile').read_text()\nkeys = ('BASE_DISTRO', 'BASE_VERSION', 'APT_SNAPSHOT', 'MISE_VERSION', 'LLVM_VERSION')\ndef bake_value(key: str) -> str:\n    pattern = re.compile(rf'variable \"{key}\"\\s*{{\\s*default = \"([^\"]+)\"', re.MULTILINE)\n    match = pattern.search(bake_text)\n    if not match:\n        raise SystemExit(f'missing bake variable default for {key}')\n    return match.group(1)\ndef dockerfile_value(key: str) -> str:\n    pattern = re.compile(rf'ARG {key}=([^\\n]+)')\n    match = pattern.search(dockerfile_text)\n    if not match:\n        raise SystemExit(f'missing Dockerfile ARG default for {key}')\n    return match.group(1).strip()\nfor key in keys:\n    left = bake_value(key)\n    right = dockerfile_value(key)\n    if left != right:\n        raise SystemExit(f'pin mismatch for {key}: bake={left!r} dockerfile={right!r}')\nprint('build pin alignment ok')\nPY",
]

[[suite]]
name = "workflow.hosted-load-disables-attest"
description = "The hosted devcontainer smoke load path disables attestations so docker --load stays compatible with the single-platform image export."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\nbake = Path('docker-bake.hcl').read_text()\nworkflow = Path('.github/workflows/devcontainer-build-hosted.yml').read_text()\nif 'target \"devcontainer-load\"' not in bake:\n    raise SystemExit('docker-bake.hcl must define devcontainer-load')\nfor token in ('inherits = [\"_common\"]', 'target = \"devcontainer\"', 'output = [\"type=docker\"]'):\n    if token not in bake:\n        raise SystemExit(f'devcontainer-load missing token: {token}')\nfor token in ('attest = [', 'inherits = [\"devcontainer\"]'):\n    if token in bake.split('target \"devcontainer-load\"', 1)[1].split('target \"', 1)[0]:\n        raise SystemExit(f'devcontainer-load must not inherit or declare attestations: {token}')\nif 'devcontainer-load' not in workflow or '--set devcontainer-load.cache-from=' not in workflow or '--set devcontainer-load.cache-to=' not in workflow:\n    raise SystemExit('hosted workflow must use devcontainer-load for the smoke load path')\nprint('hosted workflow load path uses devcontainer-load without attestations')\nPY",
]
