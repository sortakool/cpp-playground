[[suite]]
name = "devcontainer.host-user-and-ssh-wiring"
description = "The initialize step uses a thin host-user overlay and runtime mounts keep host username parity and a stable SSH agent path."
commands = [
  "python3 - <<'PY'\nimport json\nfrom pathlib import Path\nconfig = json.loads(Path('.devcontainer/devcontainer.json').read_text())\ninit = config.get('initializeCommand', '')\nif '.devcontainer/initialize-host.sh' not in init:\n    raise SystemExit(f'unexpected initializeCommand: {init}')\nmount = 'type=bind,source=${localEnv:HOME}/.local/state/cpp-playground,target=/tmp/cpp-playground-host-state'\nif mount not in config.get('mounts', []):\n    raise SystemExit('missing host state bind mount')\ncontainer_env = config.get('containerEnv', {})\nif container_env.get('CPP_PLAYGROUND_HOST_STATE_DIR') != '/tmp/cpp-playground-host-state':\n    raise SystemExit(f\"unexpected CPP_PLAYGROUND_HOST_STATE_DIR: {container_env.get('CPP_PLAYGROUND_HOST_STATE_DIR')}\")\nremote_env = config.get('remoteEnv', {})\nif remote_env.get('SSH_AUTH_SOCK') != '/tmp/cpp-playground-ssh-agent.sock':\n    raise SystemExit(f\"unexpected remote SSH_AUTH_SOCK: {remote_env.get('SSH_AUTH_SOCK')}\")\ninit_script = Path('.devcontainer/initialize-host.sh')\noverlay = Path('.devcontainer/Dockerfile.host-user')\nproxy = Path('.devcontainer/ssh_agent_proxy.py')\nif not init_script.exists():\n    raise SystemExit('missing .devcontainer/initialize-host.sh')\nif not overlay.exists():\n    raise SystemExit('missing .devcontainer/Dockerfile.host-user')\nif not proxy.exists():\n    raise SystemExit('missing .devcontainer/ssh_agent_proxy.py')\nscript = init_script.read_text()\nif 'Dockerfile.host-user' not in script:\n    raise SystemExit('initialize-host.sh must build the thin host-user overlay')\nif 'ssh_agent_proxy.py' not in script:\n    raise SystemExit('initialize-host.sh must manage the SSH agent proxy')\nif 'ssh-agent-port' not in script or '--listen-tcp' not in script:\n    raise SystemExit('initialize-host.sh must publish the host SSH agent over a localhost TCP proxy')\nif 'docker image inspect \"${devcontainer_image}\"' not in script:\n    raise SystemExit('initialize-host.sh must prefer the locally available upstream image')\nif 'docker buildx build' not in script:\n    raise SystemExit('initialize-host.sh must build the thin overlay image')\nprint('devcontainer host user and ssh wiring ok')\nPY",
]

[[suite]]
name = "devcontainer.image-reference"
description = "The devcontainer runtime uses the fully-qualified first Bake tag."
requires_commands = ["docker", "python3"]
commands = [
  "python3 - <<'PY'\nimport json\nimport subprocess\nfrom pathlib import Path\nconfig = json.loads(Path('.devcontainer/devcontainer.json').read_text())\npayload = json.loads(subprocess.check_output(['docker', 'buildx', 'bake', '-f', 'docker-bake.hcl', '--print', 'devcontainer'], text=True))\nimage = config.get('image')\nfirst_tag = payload['target']['devcontainer']['tags'][0]\nif image != first_tag:\n    raise SystemExit(f'devcontainer image {image!r} does not match first bake tag {first_tag!r}')\nif not image.startswith('ghcr.io/'):\n    raise SystemExit(f'devcontainer image must be fully qualified: {image!r}')\nprint('devcontainer image reference ok')\nPY",
]

