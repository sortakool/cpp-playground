[[suite]]
name = "image.parallel-toolchains"
description = "clang and gcc build from base without depending on each other."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ntext = Path('Dockerfile').read_text()\nif 'FROM base AS clang' not in text or 'FROM base AS gcc' not in text:\n    raise SystemExit('clang and gcc must both derive from base')\nfor bad in ('FROM clang AS gcc', 'FROM gcc AS clang', 'COPY --from=clang /opt/clang-p2996 /opt/gcc-reflection', 'COPY --from=gcc /opt/gcc-reflection /opt/clang-p2996'):\n    if bad in text:\n        raise SystemExit(f'forbidden cross-stage dependency found: {bad}')\nprint('parallel toolchain structure ok')\nPY",
]

[[suite]]
name = "image.repo-bootstrap-after-toolchains"
description = "Repo copy and bootstrap happen in final so devcontainer/runtime edits do not force toolchain rebuilds."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ntext = Path('Dockerfile').read_text()\nbase_segment = text.split('FROM base AS clang', 1)[0]\nfinal_segment = text.split('FROM base AS final', 1)[1]\nfor forbidden in ('COPY . /opt/cpp-playground', '/opt/cpp-playground/install.sh'):\n    if forbidden in base_segment:\n        raise SystemExit(f'base stage still includes repo bootstrap token: {forbidden}')\nfor required in ('COPY . /opt/cpp-playground', 'RUN chmod +x /opt/cpp-playground/install.sh', '/opt/cpp-playground/install.sh'):\n    if required not in final_segment:\n        raise SystemExit(f'final stage missing repo bootstrap token: {required}')\nprint('repo bootstrap is scoped to final')\nPY",
]

[[suite]]
name = "image.final.includes-both-toolchains"
description = "The final stage materializes both reflection toolchains."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ntext = Path('Dockerfile').read_text()\nrequired = (\n    'FROM base AS final',\n    'COPY --from=clang /opt/clang-p2996 /opt/clang-p2996',\n    'COPY --from=gcc /opt/gcc-reflection /opt/gcc-reflection',\n)\nfor token in required:\n    if token not in text:\n        raise SystemExit(f'missing final-stage token: {token}')\nprint('final stage includes both toolchains')\nPY",
]

[[suite]]
name = "bootstrap.install-entrypoint"
