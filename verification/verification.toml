[[suite]]
name = "cleanup.one-dockerfile"
description = "The repo keeps the single root build Dockerfile plus the thin devcontainer host-user overlay."
requires_commands = ["python3"]
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ndockerfiles = sorted(str(path) for path in Path('.').rglob('Dockerfile*') if path.is_file() and '.git/' not in str(path))\nexpected = ['.devcontainer/Dockerfile.host-user', 'Dockerfile']\nif dockerfiles != expected:\n    raise SystemExit(f'unexpected Dockerfile set: {dockerfiles}')\nprint('dockerfile surface ok')\nPY",
]

[[suite]]
name = "cleanup.no-control-plane"
description = "The old Python control plane and split Dockerfile graph are gone."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\nfor path in (\n    Path('tooling'),\n    Path('.devcontainer/Dockerfile'),\n    Path('tooling/cpp26-dev-images/Dockerfile.clang-p2996'),\n    Path('tooling/cpp26-dev-images/Dockerfile.gcc-reflection'),\n    Path('tooling/cpp26-dev-images/Dockerfile.clang-p2996-quantlib'),\n    Path('home/.chezmoiscripts'),\n):\n    if path.exists():\n        raise SystemExit(f'legacy path still exists: {path}')\nprint('legacy control-plane paths removed')\nPY",
]

[[suite]]
name = "cleanup.no-generated-artifacts"
description = "Tracked cache, bytecode, egg-info, and ad-hoc log artifacts are gone."
requires_commands = ["python3"]
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\nignored_prefixes = ('.git/', '.pixi/', '.venv/', 'out/', 'src/cpp_playground/__pycache__/')\nbad = []\nfor path in Path('.').rglob('*'):\n    if not path.exists() or not path.is_file():\n        continue\n    text = str(path)\n    if text.startswith(ignored_prefixes):\n        continue\n    if '__pycache__/' in text or text.endswith('.pyc') or '.egg-info/' in text or text == 'firebase-debug.log':\n        bad.append(text)\nif bad:\n    raise SystemExit(f'generated artifacts still present: {bad}')\nprint('generated artifacts absent from repo-owned worktree paths')\nPY",
]

[[suite]]
name = "cleanup.chezmoi-dot-naming"
description = "Managed chezmoi target paths under home use dot_ naming."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\nroot = Path('home')\nallowed = {'.chezmoi.toml.tmpl', '.chezmoitemplates', '.chezmoidata'}\nfor path in root.iterdir():\n    if path.name in allowed:\n        continue\n    if path.name.startswith('.'):\n        raise SystemExit(f'raw dotfile path is not allowed under home/: {path}')\nprint('chezmoi dot_ naming ok')\nPY",
]

[[suite]]
name = "cleanup.no-duplicate-orchestration"
description = "mise, pixi, and Python no longer expose the old orchestration surface."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\nfor file_name in ('mise.toml', 'pixi.toml', 'pyproject.toml'):\n    text = Path(file_name).read_text()\n    for token in (\n        'build-devcontainer-image',\n        'build-cpp26-images',\n        'refresh',\n        'sync-generated',\n        'validate-runtime',\n        'validate-repo',\n        'validate-docker-images',\n        'devcontainer-up-macos',\n        'host-preflight-macos',\n        'smoke-ssh-into-devcontainer',\n        'sync-devcontainer-ssh-known-hosts',\n        'python3 -m tooling',\n        'uv run -m tooling',\n    ):\n        if token in text:\n            raise SystemExit(f'legacy orchestration token still present in {file_name}: {token}')\nprint('duplicate orchestration removed')\nPY",
]

[[suite]]
name = "image.stage-names.exact"
description = "The root Dockerfile exposes the exact canonical stage names."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ntext = Path('Dockerfile').read_text().splitlines()\nstages = [line.split(' AS ', 1)[1].strip() for line in text if line.startswith('FROM ') and ' AS ' in line]\nexpected = ['base', 'clang', 'gcc', 'final', 'devcontainer']\nif stages != expected:\n    raise SystemExit(f'unexpected stage order: {stages}')\nprint('stage names ok')\nPY",
]

[[suite]]
name = "image.bake-targets"
description = "Bake exposes the expected target and group surface."
commands = [
  "python3 - <<'PY'\nfrom pathlib import Path\ntext = Path('docker-bake.hcl').read_text()\nfor token in ('dockerfile = \"Dockerfile\"', 'target \"base\"', 'target \"clang\"', 'target \"gcc\"', 'target \"final\"', 'target \"devcontainer\"', 'group \"toolchains\"', 'group \"default\"'):\n    if token not in text:\n        raise SystemExit(f'missing bake token: {token}')\nprint('bake targets ok')\nPY",
]

[[suite]]
name = "image.bake-print.devcontainer"
description = "Resolved Bake output still points at the single root Dockerfile."
requires_commands = ["docker", "python3"]
commands = [
  "python3 - <<'PY'\nimport json\nimport subprocess\npayload = json.loads(subprocess.check_output(['docker', 'buildx', 'bake', '-f', 'docker-bake.hcl', '--print', 'devcontainer'], text=True))\ntarget = payload['target']['devcontainer']\nif target.get('dockerfile') != 'Dockerfile':\n    raise SystemExit(f\"unexpected dockerfile: {target.get('dockerfile')}\")\nif target.get('context') != '.':\n    raise SystemExit(f\"unexpected context: {target.get('context')}\")\nprint('bake print uses root Dockerfile')\nPY",
]

