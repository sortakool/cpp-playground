[[suite]]
name = "cleanup.one-dockerfile"
description = "The repo keeps the single root Dockerfile plus the thin host-user overlay."
handler = "cleanup_one_dockerfile"

[[suite]]
name = "image.stage-names.exact"
description = "The root Dockerfile exposes the canonical stage order."
handler = "image_stage_names_exact"

[[suite]]
name = "image.bake-targets"
description = "Bake exposes the expected canonical target and group surface."
handler = "image_bake_targets"

[[suite]]
name = "image.bake-print.devcontainer"
description = "Resolved Bake output still points at the root Dockerfile."
handler = "image_bake_print_devcontainer"
requires_commands = ["docker"]

[[suite]]
name = "image.final-bootstrap-boundary"
description = "Bootstrap inputs are copied before the full repo in the final stage."
handler = "image_final_bootstrap_boundary"

[[suite]]
name = "bootstrap.install-entrypoint"
description = "install.sh stays a thin Python trampoline."
handler = "bootstrap_install_entrypoint"

[[suite]]
name = "cli.console-scripts"
description = "pyproject exposes the canonical cpp-playground console script."
handler = "cli_console_scripts"

[[suite]]
name = "devcontainer.surface"
description = "The devcontainer uses the Python CLI for initialize and runtime hooks."
handler = "devcontainer_surface"

[[suite]]
name = "policy.codex-config-surface"
description = "Only project config remains under .codex."
handler = "policy_codex_config_surface"

[[suite]]
name = "policy.no-shell-automation"
description = "The only live checked-in shell automation surface is install.sh; archived docs may preserve historical shell scripts."
handler = "policy_no_shell_automation"

[[suite]]
name = "policy.no-executable-helpers"
description = "Repo-owned executable helpers live under src/cpp_playground."
handler = "policy_no_executable_helpers"

[[suite]]
name = "hooks.hk-only"
description = "hk is the only checked-in hook manager and its config is present."
handler = "hooks_hk_only"

[[suite]]
name = "docs.live-surface"
description = "Live docs and skills do not reference deprecated .codex paths or removed helper scripts."
handler = "docs_live_surface"

[[suite]]
name = "docs.canonical-plan"
description = "The canonical merged plan and archive roots are present."
handler = "docs_canonical_plan"

[[suite]]
name = "workflow.hosted-candidate-flow"
description = "The hosted workflow builds feedback fast, publishes a sha candidate, and promotes only after authoritative validation."
handler = "workflow_hosted_candidate_flow"

[[suite]]
name = "workflow.pr-source-build-proof"
description = "The self-hosted proof workflow builds from source and uses the Python smoke/verify entrypoints."
handler = "workflow_pr_source_build_proof"
