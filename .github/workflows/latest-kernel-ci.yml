name: latest-kernel-ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  latest-kernel:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - latest-kernel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install locked pixi environment
        run: pixi install --locked

      - name: Configure host kernel test lane
        run: pixi run -e gcc-stable cmake --preset gcc-stable

      - name: Build host kernel test lane
        run: pixi run -e gcc-stable cmake --build --preset gcc-stable

      - name: Run kernel-labeled tests
        run: pixi run -e gcc-stable sudo --preserve-env=PATH,HOME ctest --test-dir out/build/gcc-stable --output-on-failure -L kernel
