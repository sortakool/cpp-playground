name: devcontainer-build-hosted

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .devcontainer/**
      - .agents/skills/**
      - docs/**
      - hk.pkl
      - install.sh
      - mise.toml
      - pixi.toml
      - pyproject.toml
      - src/cpp_playground/**
      - verification/**
      - .github/workflows/devcontainer-build-hosted.yml
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the devcontainer candidate image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  PUBLISH_REGISTRY: ghcr.io/ray-manaloto
  PUBLISH_IMAGE: cpp-devcontainer

jobs:
  contract-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Run contract preflight
        run: |
          uv run cpp-playground verify run --suite cleanup.one-dockerfile
          uv run cpp-playground verify run --suite image.stage-names.exact
          uv run cpp-playground verify run --suite image.bake-targets
          uv run cpp-playground verify run --suite image.final-bootstrap-boundary
          uv run cpp-playground verify run --suite policy.codex-config-surface
          uv run cpp-playground verify run --suite hooks.hk-only

  hosted-build:
    runs-on: ubuntu-latest
    needs:
      - contract-preflight
    outputs:
      publish_candidate: ${{ steps.publish-plan.outputs.publish_candidate }}
      candidate_tag: ${{ steps.publish-plan.outputs.candidate_tag }}
      promoted_tags: ${{ steps.publish-plan.outputs.promoted_tags }}
      base_ref: ${{ steps.publish-plan.outputs.base_ref }}
      clang_ref: ${{ steps.publish-plan.outputs.clang_ref }}
      gcc_ref: ${{ steps.publish-plan.outputs.gcc_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Install locked pixi environment
        run: pixi install --locked

      - uses: docker/setup-buildx-action@v3

      - name: Resolve publish plan
        id: publish-plan
        run: |
          uv run cpp-playground image publish-plan \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --ref-name "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --registry "${{ env.PUBLISH_REGISTRY }}" \
            --image "${{ env.PUBLISH_IMAGE }}" \
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && '--dispatch-publish' || '' }} \
            --github-output

      - name: Log in to GHCR
        if: steps.publish-plan.outputs.publish_candidate == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable base stage artifact
        if: steps.publish-plan.outputs.publish_candidate == 'true'
        run: docker buildx bake -f docker-bake.hcl base --set base.tags=${{ steps.publish-plan.outputs.base_ref }} --push

      - name: Publish immutable clang stage artifact
        if: steps.publish-plan.outputs.publish_candidate == 'true'
        run: docker buildx bake -f docker-bake.hcl clang --set clang.tags=${{ steps.publish-plan.outputs.clang_ref }} --push

      - name: Publish immutable gcc stage artifact
        if: steps.publish-plan.outputs.publish_candidate == 'true'
        run: docker buildx bake -f docker-bake.hcl gcc --set gcc.tags=${{ steps.publish-plan.outputs.gcc_ref }} --push

      - name: Build hosted devcontainer graph for feedback
        if: steps.publish-plan.outputs.publish_candidate != 'true'
        run: docker buildx bake -f docker-bake.hcl devcontainer

      - name: Publish candidate devcontainer image
        if: steps.publish-plan.outputs.publish_candidate == 'true'
        run: docker buildx bake -f docker-bake.hcl devcontainer --set devcontainer.tags=${{ steps.publish-plan.outputs.candidate_tag }} --push

  authoritative-published-image:
    if: needs.hosted-build.outputs.publish_candidate == 'true'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - latest-kernel
    needs:
      - hosted-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Install locked pixi environment
        run: pixi install --locked

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        run: docker pull ${{ needs.hosted-build.outputs.candidate_tag }}

      - name: Smoke candidate image
        run: uv run cpp-playground image smoke --image-ref ${{ needs.hosted-build.outputs.candidate_tag }}

      - name: Run repo verification
        run: uv run cpp-playground verify run

  promote-candidate:
    if: needs.hosted-build.outputs.publish_candidate == 'true' && needs.hosted-build.outputs.promoted_tags != ''
    runs-on: ubuntu-latest
    needs:
      - hosted-build
      - authoritative-published-image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote validated candidate tag
        run: |
          uv run cpp-playground image promote \
            --source-ref "${{ needs.hosted-build.outputs.candidate_tag }}" \
            --target-refs-csv "${{ needs.hosted-build.outputs.promoted_tags }}"
