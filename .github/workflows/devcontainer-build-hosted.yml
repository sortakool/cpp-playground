name: devcontainer-build-hosted

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .devcontainer/**
      - verification/**
      - install.sh
      - scripts/smoke-devcontainer-image.sh
      - .github/workflows/devcontainer-build-hosted.yml
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the devcontainer image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  HOSTED_CACHE_FROM: type=gha
  HOSTED_CACHE_TO: type=gha,mode=max
  PUBLISH_REGISTRY: ghcr.io/ray-manaloto
  PUBLISH_IMAGE: cpp-devcontainer

jobs:
  contract-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Run image contract preflight
        run: |
          uv run verify run --suite image.stage-names.exact
          uv run verify run --suite image.bake-targets
          uv run verify run --suite devcontainer.from-final
          uv run verify run --suite build-optimization.pin-alignment

  hosted-build:
    runs-on: ubuntu-latest
    needs:
      - contract-preflight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          : > "${RUNNER_TEMP}/mise/config.toml"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Install Python helper environment
        run: uv sync --locked --group dev

      - name: Install locked pixi environment
        run: pixi install --locked

      - uses: docker/setup-buildx-action@v3

      - name: Resolve publish plan
        id: publish-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DISPATCH_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || 'false' }}
          PUBLISH_REGISTRY: ${{ env.PUBLISH_REGISTRY }}
          PUBLISH_IMAGE: ${{ env.PUBLISH_IMAGE }}
        run: |
          publish=false
          tags=()

          if [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            publish=true
            tags+=(
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:dev"
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:sha-${SHA}"
            )
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/tags/* ]]; then
            publish=true
            tags+=(
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:${REF_NAME}"
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:sha-${SHA}"
            )
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_PUBLISH}" == "true" ]]; then
            publish=true
            tags+=(
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:dev"
              "${PUBLISH_REGISTRY}/${PUBLISH_IMAGE}:sha-${SHA}"
            )
          fi

          {
            echo "publish=${publish}"
            echo "tags=$(IFS=,; echo "${tags[*]}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Build hosted image graph
        run: |
          docker buildx bake -f docker-bake.hcl \
            --set devcontainer.cache-from="${HOSTED_CACHE_FROM}" \
            --set devcontainer.cache-to="${HOSTED_CACHE_TO}" \
            base clang gcc final devcontainer

      - name: Load hosted devcontainer image for structural smoke
        run: |
          docker buildx bake -f docker-bake.hcl \
            --set devcontainer.cache-from="${HOSTED_CACHE_FROM}" \
            --set devcontainer.cache-to="${HOSTED_CACHE_TO}" \
            devcontainer --load

      - name: Run hosted structural smoke
        run: ./scripts/smoke-devcontainer-image.sh

      - name: Log in to GHCR
        if: steps.publish-plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish devcontainer image
        if: steps.publish-plan.outputs.publish == 'true'
        run: |
          docker buildx bake -f docker-bake.hcl \
            --set devcontainer.tags="${{ steps.publish-plan.outputs.tags }}" \
            devcontainer --push
