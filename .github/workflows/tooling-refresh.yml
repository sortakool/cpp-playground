name: tooling-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: jdx/mise-action@v2

      - name: Install repo tools
        run: |
          mise trust .
          mkdir -p "${RUNNER_TEMP}/mise"
          MISE_GLOBAL_CONFIG_FILE="${RUNNER_TEMP}/mise/config.toml" \
          MISE_IGNORED_CONFIG_PATHS="${HOME}/.config/mise" \
          mise install --locked

      - name: Refresh pinned versions and lockfiles
        run: python3 -m tooling refresh

      - name: Validate refreshed repo state
        run: python3 -m tooling validate --mode repo

      - name: Create refresh pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/tooling-refresh
          commit-message: "chore: refresh pinned toolchain versions"
          title: "chore: refresh pinned toolchain versions"
          body: |
            Automated refresh of exact tool and kernel pins.

            This PR was generated by `python3 -m tooling refresh`.
          labels: |
            automation
            auto-merge

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
