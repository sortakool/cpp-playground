[workspace]
channels = ["conda-forge"]
description = "Locked C++26 playground environment with pixi-managed compiler lanes"
name = "cpp-playground"
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.66.0"

[dependencies]
cmake = ">=3.31,<4"
ninja = ">=1.12,<2"
pkg-config = ">=0.29.2,<1"
pre-commit = ">=4,<5"
python = "3.12.*"
reuse = ">=5,<6"
yamllint = ">=1.37,<2"

[feature.llvm-stable.activation.env]
CC = "/opt/llvm/22.1.1/bin/clang"
CXX = "/opt/llvm/22.1.1/bin/clang++"
LLVM_HOME = "/opt/llvm/22.1.1"
LLVM_VERSION = "22.1.1"

[feature.llvm-stable.target.linux-64.dependencies]
include-what-you-use = "==0.25"

[feature.gcc-stable.target.linux-64.dependencies]
gcc_linux-64 = "==15.2.0"
gxx_linux-64 = "==15.2.0"

[feature.gcc-reflection.activation.env]
CC = "/usr/local/bin/gcc-reflection"
CXX = "/usr/local/bin/g++-reflection"

[feature.clang-p2996.activation.env]
CC = "/usr/local/bin/clang-p2996"
CXX = "/usr/local/bin/clang-p2996++"

[tasks]
bootstrap = "uv run -m tooling bootstrap"
build-cpp26-images = "uv run -m tooling build-cpp26-images --toolchain all --flavor core"
build-devcontainer-image = "uv run -m tooling build-devcontainer-image"
bump-cpp26-toolchain-pins = "uv run -m tooling bump-cpp26-toolchain-pins"
check-cpp26-toolchain-pins = "uv run -m tooling check-cpp26-toolchain-pins"
devcontainer-up-macos = "uv run -m tooling devcontainer-up-macos"
host-preflight-macos = "uv run -m tooling host-preflight-macos"
install-phase0-review-skills = "uv run -m tooling install-phase0-review-skills"
lint-manifests = "yamllint ."
refresh = "uv run -m tooling refresh"
review-plan-phase0 = "uv run -m tooling review-plan-phase0 spec/2026-03-22-chezmoi-mise-devcontainer-migration-plan.md"
review-plan-phase0-dry-run = "uv run -m tooling review-plan-phase0 spec/2026-03-22-chezmoi-mise-devcontainer-migration-plan.md --dry-run"
reuse-lint = "reuse lint"
ruff-check = "uv run ruff check tooling"
ruff-format = "uv run ruff format --check tooling"
smoke-ssh-git-gh-parity = "uv run -m tooling smoke-ssh-git-gh-parity"
smoke-ssh-into-devcontainer = "uv run -m tooling smoke-ssh-into-devcontainer"
sync-devcontainer-ssh-known-hosts = "uv run -m tooling sync-devcontainer-ssh-known-hosts"
sync-generated = "uv run -m tooling sync-generated"
ty-check = "uv run ty check tooling"
validate-all = "uv run -m tooling validate --mode all"
validate-docker-images = "uv run -m tooling validate-docker-images"
validate-repo = "uv run -m tooling validate --mode repo"
validate-runtime = "uv run -m tooling validate --mode runtime"
prove-devcontainer = "uv run -m tooling prove --surface devcontainer"
prove-latest-kernel-vm = "uv run -m tooling prove --surface latest-kernel-vm"
prove-latest-kernel-ci = "uv run -m tooling prove --surface latest-kernel-ci"

[environments]
default = []
llvm-stable = ["llvm-stable"]
gcc-stable = ["gcc-stable"]
toolchains-stable = ["llvm-stable", "gcc-stable"]
gcc-reflection = ["gcc-reflection"]
clang-p2996 = ["clang-p2996"]
