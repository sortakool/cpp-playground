[workspace]
channels = ["conda-forge"]
description = "Locked C++26 playground environments and leaf verification tasks"
name = "cpp-playground"
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.66.0"

[dependencies]
cmake = ">=3.31,<4"
ninja = ">=1.12,<2"
pkg-config = ">=0.29.2,<1"
pre-commit = ">=4,<5"
python = "3.12.*"
reuse = ">=5,<6"
yamllint = ">=1.37,<2"

[feature.llvm-stable.activation.env]
CC = "/opt/llvm/current/bin/clang"
CXX = "/opt/llvm/current/bin/clang++"
LLVM_HOME = "/opt/llvm/current"

[feature.llvm-stable.target.linux-64.dependencies]
include-what-you-use = "==0.25"

[feature.gcc-stable.target.linux-64.dependencies]
gcc_linux-64 = "==15.2.0"
gxx_linux-64 = "==15.2.0"

[feature.gcc-reflection.activation.env]
CC = "/opt/gcc-reflection/bin/gcc"
CXX = "/opt/gcc-reflection/bin/g++"

[feature.clang-p2996.activation.env]
CC = "/opt/clang-p2996/bin/clang"
CXX = "/opt/clang-p2996/bin/clang++"

[tasks]
ctest-gcc-stable = "ctest --preset gcc-stable --output-on-failure"
ctest-llvm-stable = "ctest --preset llvm-stable --output-on-failure"
docker-bake-check = "docker buildx bake -f docker-bake.hcl --check base clang gcc final devcontainer"
dockerfile-lint = "docker run --rm -v \"$PWD:/work\" -w /work hadolint/hadolint hadolint Dockerfile"
ruff-check = "uv run ruff check src"
ruff-format = "uv run ruff format --check src"
ty-check = "uv run ty check src"
verify-all = "uv run verify run --all"
verify-json = "uv run verify run --all --json"

[environments]
default = []
llvm-stable = ["llvm-stable"]
gcc-stable = ["gcc-stable"]
toolchains-stable = ["llvm-stable", "gcc-stable"]
gcc-reflection = ["gcc-reflection"]
clang-p2996 = ["clang-p2996"]
